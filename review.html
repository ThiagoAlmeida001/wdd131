<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form – Thiago da Silva Almeida</title>
    <meta name="description"
      content="WDD 131 Product Review Form - A dynamic web product review form page.">
    <meta name="author" content="Thiago da Silva Almeida">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Review Submitted!</h1>
    </header>
    
    <main>
        <div class="confirmation-card">
            <h2>Thank you for your feedback!</h2>
            <p>Your product review has been successfully registered and processed.</p>
            
            <div class="counter-display">
                <p>Total reviews submitted by you: <span id="review-counter">0</span></p>
            </div>
            
            <div class="form-actions">
                <a href="form.html" class="button-link">Submit Another Review</a>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span>🎶 Thiago Almeida 🎶 Santiago, Chile</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
